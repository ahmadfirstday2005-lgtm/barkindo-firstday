<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Barkindo FirstDay</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <div class="registration-container">
        <h1>Log In</h1>
        <p class="subtitle">Welcome back</p>

        <div id="loginErrors" class="error-box"></div>

        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Your password">
                    <button type="button" class="eye-btn" data-toggle="password" aria-label="Show password">👁️</button>
                </div>
            </div>

            <button type="submit" class="register-btn">Log In</button>
        </form>

        <p class="switch-text">No account yet? <a href="/">Register</a></p>
    </div>
</body>
</html>
